server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Маршрут Vue `/assets` совпадает с каталогом собранной статики `/assets/`.
    # Без отдельного exact location nginx перенаправляет его в каталог вместо SPA.
    location = /assets {
        try_files "" /index.html;
    }

    # Service worker должен всегда получать актуальную версию после деплоя.
    location = /sw.js {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
    }

    # Раздаём файлы сборки, а неизвестные пути передаём Vue Router.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
