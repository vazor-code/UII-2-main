# Образец production-конфигурации nginx с HTTPS (TLS termination).
#
# Применение:
#   1. Разместить сертификаты (например, certbot) по путям ниже.
#   2. Заменить SERVER_NAME на фактический домен.
#   3. Примонтировать этот файл в контейнер nginx и открыть порт 443.
#
# Сначала выполнить: nginx -t, затем reload.
# При включении HTTPS также задайте в .env: HSTS_ENABLED=true,
# COOKIE_SECURE=true, ENV=production.

events {}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Лимиты на загрузку файлов
    client_max_body_size 20m;

    # HSTS добавляется и на уровне бэкенда (hsts_enabled), здесь дублируем для безопасности
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    upstream backend_upstream { server backend:8000; }
    upstream frontend_upstream { server frontend:80; }

    server {
        listen 80;
        server_name SERVER_NAME;
        # Редирект на HTTPS
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name SERVER_NAME;

        ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         HIGH:!aNULL:!MD5;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;

        # API (префикс /api срезается)
        location /api/ {
            proxy_pass http://backend_upstream/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # SPA + PWA
        location / {
            proxy_pass http://frontend_upstream;
            proxy_set_header Host $host;
            location ~* \.(js|css)$ {
                proxy_pass http://frontend_upstream;
                add_header Cache-Control "no-cache";
            }
        }
    }
}